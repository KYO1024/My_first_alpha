name: Theme Second Wave Monitor

on:
  workflow_dispatch:
    inputs:
      watchlist_path:
        description: "Path to watch_list.xlsx in the repository"
        required: false
        default: "watch_list.xlsx"
      max_results:
        description: "Max rows to include in the dashboard"
        required: false
        default: "30"
      send_discord:
        description: "Send dashboard to Discord"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # GitHub cron uses UTC. 10:30 UTC = 18:30 Asia/Shanghai.
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: theme-second-wave-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      WATCHLIST_PATH: ${{ github.event.inputs.watchlist_path || 'watch_list.xlsx' }}
      MAX_RESULTS: ${{ github.event.inputs.max_results || '30' }}
      SEND_DISCORD: ${{ github.event.inputs.send_discord || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate code
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall theme_second_wave scripts tests
          python -m pytest -q

      - name: Ensure watchlist exists
        run: |
          test -f "$WATCHLIST_PATH"

      - name: Restore decision memory
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/decision_log.jsonl
            reports/decision_log.md
          key: decision-log-${{ github.run_id }}
          restore-keys: |
            decision-log-

      - name: Run scanner
        run: |
          if [ "$SEND_DISCORD" = "true" ] && [ -n "$DISCORD_WEBHOOK_URL" ]; then
            python -m theme_second_wave.cli scan \
              --watchlist "$WATCHLIST_PATH" \
              --max-results "$MAX_RESULTS" \
              --report-dir reports \
              --send-discord
          else
            if [ "$SEND_DISCORD" = "true" ] && [ -z "$DISCORD_WEBHOOK_URL" ]; then
              echo "::warning::DISCORD_WEBHOOK_URL secret is not configured; dashboard will be generated without Discord push."
            fi
            python -m theme_second_wave.cli scan \
              --watchlist "$WATCHLIST_PATH" \
              --max-results "$MAX_RESULTS" \
              --report-dir reports
          fi

      - name: Save decision memory
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            reports/decision_log.jsonl
            reports/decision_log.md
          key: decision-log-${{ github.run_id }}

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-second-wave-dashboard
          path: |
            reports/latest_dashboard.md
            reports/latest_results.csv
            reports/latest_run_card.json
            reports/run_card_*.json
            reports/decision_log.jsonl
            reports/decision_log.md
            reports/scan_*.md
          if-no-files-found: ignore
          retention-days: 14
